<body>

<script>
/* ============ EDIT YOUR WEDDING DETAILS HERE ============ */
const W = {

<!-- Floating Play/Pause Button -->
<button id="audio-toggle-btn" aria-label="Toggle Audio" title="Play/Pause Music">
  <!-- Pause Icon (shown when playing) -->
  <svg id="icon-pause" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="#ffffff"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  <!-- Play Icon (shown when paused) -->
  <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="#ffffff" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
</button>

<style>
  /* Styling for the floating button at bottom right */
  #audio-toggle-btn {
    position: fixed;
    bottom: 40px;
    right: 25px;
    z-index: 9999;
    background-color: #d4af37; /* Wedding gold theme color */
    color: white;
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  #audio-toggle-btn:hover {
    transform: scale(1.1);
    background-color: #b38f27;
  }
a:empty, button:empty, .map-btn:empty {
    display: none !important;
  }  }

</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const audio = document.getElementById("bg-audio");
    const btn = document.getElementById("audio-toggle-btn");
    const iconPlay = document.getElementById("icon-play");
    const iconPause = document.getElementById("icon-pause");

    audio.volume = 0.5;

    // Try playing automatically on load
    let playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.then(_ => {
        iconPlay.style.display = "none";
        iconPause.style.display = "block";
      }).catch(error => {
        iconPlay.style.display = "block";
        iconPause.style.display = "none";
      });
    }

    // Toggle button click control
    btn.addEventListener("click", function () {
      if (audio.paused) {
        audio.play();
        iconPlay.style.display = "none";
        iconPause.style.display = "block";
      } else {
        audio.pause();
        iconPlay.style.display = "block";
        iconPause.style.display = "none";
      }
    });

    // UNLOCK AUDIO: The moment a visitor taps anywhere on the screen (like your SCROLL button), start the music!
    function unlockAudio() {
      if (audio.paused) {
        audio.play().then(() => {
          iconPlay.style.display = "none";
          iconPause.style.display = "block";
          // Remove the listeners once successfully playing
          document.removeEventListener("click", unlockAudio);
          document.removeEventListener("touchstart", unlockAudio);
        }).catch(e => console.log(e));
      }
    }

    document.addEventListener("click", unlockAudio);
    document.addEventListener("touchstart", unlockAudio);
  });
</script>
